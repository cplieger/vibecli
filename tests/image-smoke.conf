# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Waits for the container HEALTHCHECK (HTTP GET
# /api/health on :9848) to report "healthy" - proving the server binds, the
# embedded UI is present, the health endpoint serves, AND that kiro-cli installed:
# health reports 200 only once a kiro-cli version is active.
#
# First boot is no longer blocking. entrypoint.sh hardens /config, applies
# APT_PACKAGES, prunes superseded agent runtimes and execs the server, which then
# downloads and verifies kiro-cli in the BACKGROUND (tool installs converge
# alongside it). So the listener comes up within seconds and a probe during the
# download answers 503 with a reason instead of being refused; the harness still
# waits for "healthy", so what it proves is unchanged.
#
# TIMEOUT covers the image's HEALTHCHECK start-period (20m, the SELECTED startup
# tolerance) plus two 30s probe intervals (1260 = 1200 + 2x30). Neither budget
# covers the worst-case install: the archive fetch is bounded by a 60s
# no-progress stall guard rather than a wall-clock cap, and a failed attempt is
# retried up to 4 times with 30s/60s/120s backoff. Nor does it cover the
# interrupted-dpkg recovery (dpkg --audit and dpkg --configure -a, 300+30s each,
# taking the foreground sum from 1030s to 1690s), whose deadlines are reached
# only on a boot following an APT_PACKAGES install that was killed
# mid-transaction — never on a healthy boot, where the audit probe is a no-op.
#
# That shortfall is DELIBERATE (decided 2026-07), not a pending decision. This
# harness runs on a GitHub-hosted runner over a fast link, where the 528MB
# download takes minutes; a smoke boot that outlasts the start-period means
# something is genuinely wrong, so failing here is correct signal rather than a
# false negative. Raising both budgets to cover the retry envelope would make a
# hung CI job burn ~3 hours of Actions time before failing, which is a real
# recurring cost against a theoretical worst case. At runtime the same shortfall
# is cosmetic: health failures never restart the container (the restart policy
# acts on process exit), so a slow first boot shows unhealthy and then converges.
# Keep in lockstep with the Dockerfile start-period and its HEALTHCHECK comment,
# which carries the full derivation.
SMOKE_APP_NAME=web-terminal-kiro
SMOKE_TIMEOUT=1260

# Post-health verification: every target of the served importmap must answer
# 200 with a non-empty body. This is the deterministic core of the browser
# failure class: /vendor/** is gitignored AND dockerignored, produced during
# the image build, so tsc and the Docker build both stay green when a vendor
# copy is missing or a library renamed a subpath - and the browser then aborts
# module loading behind the loading overlay. Three curls prove the artifact
# serves what its own importmap promises. Probed from INSIDE the container
# (the harness publishes no ports); curl is in the image (the HEALTHCHECK is
# curl). Full JS-executing boot checks live in static-src/e2e/ for local runs
# and the ui-qa skill, deliberately NOT in CI.
smoke_verify() {
  targets=$(docker exec "$SMOKE_CONTAINER" curl -sfS --max-time 5 http://127.0.0.1:9848/ \
    | sed -n '/<script type="importmap">/,/<\/script>/p' \
    | grep -o '"/[^"]*"' | tr -d '"')
  [ -n "$targets" ] || {
    printf 'FAIL: served index.html carries no importmap targets\n' >&2
    return 1
  }
  n=0
  for t in $targets; do
    n=$((n + 1))
    size=$(docker exec "$SMOKE_CONTAINER" curl -sfS --max-time 5 -o /dev/null \
      -w '%{size_download}' "http://127.0.0.1:9848${t}") || {
      printf 'FAIL: importmap target %s is not served (missing vendor tree in the image?)\n' "$t" >&2
      return 1
    }
    [ "$size" -gt 0 ] || {
      printf 'FAIL: importmap target %s served an empty body\n' "$t" >&2
      return 1
    }
  done
  printf 'importmap: all %s targets served\n' "$n"
}
