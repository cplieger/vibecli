# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Waits for the container HEALTHCHECK (HTTP GET
# /api/health on :9848) to report "healthy" - proving the server binds, the
# embedded UI is present, and the health endpoint serves. First boot is
# blocking: entrypoint.sh downloads and verifies kiro-cli in the foreground
# before the server binds (tool installs converge in the background after the
# listener is up), so /api/health stays down until the kiro-cli install
# finishes. TIMEOUT covers the image's HEALTHCHECK start-period (20m, the
# SELECTED startup tolerance) plus two 30s probe intervals (1260 = 1200 +
# 2x30). Neither budget covers the entrypoint's foreground allowance-sum:
# since the kiro-cli download moved from a flat --max-time 300 to stall
# detection with a 3600s backstop, the single-attempt sum is ~4830s with
# APT_PACKAGES (~3870s without, untimed local work such as sha-256
# verification and unzip outside the sums) and the retry envelope
# (--retry-max-time 5400, which bars only STARTING a retry, so the last attempt
# can still run its 3600s cap) reaches ~10230s. A slow-but-alive first boot
# therefore fails this harness;
# resolving that gap is a pending maintainer decision - see the Dockerfile
# HEALTHCHECK comment. Keep in lockstep with the Dockerfile start-period.
SMOKE_APP_NAME=web-terminal-kiro
SMOKE_TIMEOUT=1260
